name: Build and Auto-Publish Release

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_release:
    name: Build & Auto Release by Gradle Version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necesario para leer el historial de commits y tags previos

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Extract Version from Gradle
        id: get_version
        run: |
          VERSION=$(./gradlew -q printVersionName | tail -n 1 | tr -d '\r\n')
          TAG="v$VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Detected App Version: $VERSION"
          echo "Target Release Tag: $TAG"

      - name: Check If Tag Already Exists
        id: check_tag
        run: |
          if git ls-remote --tags origin "refs/tags/${{ env.TAG }}" | grep -q "${{ env.TAG }}"; then
            echo "::notice::La versión ${{ env.TAG }} ya existe en GitHub. Se omitirá la compilación y publicación."
            echo "is_new=false" >> $GITHUB_OUTPUT
          else
            echo "::notice::¡Nueva versión detectada (${{ env.TAG }})! Se procederá a compilar."
            echo "is_new=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Git Tag
        if: steps.check_tag.outputs.is_new == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ env.TAG }}"
          git push origin "${{ env.TAG }}"

      - name: Prepare Signing Keystore
        if: steps.check_tag.outputs.is_new == 'true' || github.event_name == 'workflow_dispatch'
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Keystore secret encontrado. Decodificando..."
            echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > ${{ runner.temp }}/release.keystore
            echo "KEYSTORE_FILE=${{ runner.temp }}/release.keystore" >> $GITHUB_ENV

            echo "Verificando clave en keystore..."
            keytool -list -keystore ${{ runner.temp }}/release.keystore -storepass "$KEYSTORE_PASSWORD" > /dev/null 2>&1 || {
              echo "::error::La contraseña KEYSTORE_PASSWORD no pudo abrir el keystore. Revisa la contraseña o el Base64."
            }
          else
            echo "Aviso: KEYSTORE_BASE64 no configurado en Secrets. Se usará firma de fallback."
          fi

      - name: Build Release APK
        if: steps.check_tag.outputs.is_new == 'true' || github.event_name == 'workflow_dispatch'
        env:
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Locate Output APK & Prepare Latest Copy
        if: steps.check_tag.outputs.is_new == 'true' || github.event_name == 'workflow_dispatch'
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No se encontró ningún APK generado en release."
            exit 1
          fi

          DIR=$(dirname "$APK_PATH")
          LATEST_PATH="$DIR/NEON_OS_TV-latest.apk"
          cp "$APK_PATH" "$LATEST_PATH"

          echo "APK con versión detectado: $APK_PATH"
          echo "Copia para enlace universal: $LATEST_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "latest_path=$LATEST_PATH" >> $GITHUB_OUTPUT

      # -------------------------------------------------------------
      # GENERACIÓN DE NOTAS CON GEMINI 3.8 FLASH
      # -------------------------------------------------------------
      - name: Generate AI Release Notes with Gemini
        if: steps.check_tag.outputs.is_new == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log "$PREV_TAG..HEAD" --pretty=format:"- %s" --no-merges)
          else
            COMMITS=$(git log -n 10 --pretty=format:"- %s" --no-merges)
          fi

          if [ -z "$COMMITS" ]; then
            COMMITS="Optimizaciones de rendimiento y corrección de errores generales."
          fi

          NOTES=""

          if [ -n "$GEMINI_API_KEY" ]; then
            echo "Solicitando changelog inteligente a Gemini 3.8 Flash..."

            PROMPT="Eres el encargado de publicar actualizaciones para 'NEOS OS TV' (launcher Cyberpunk para Android TV). A partir de la siguiente lista de commits técnicos, redacta un registro de cambios (changelog) en español para los usuarios del televisor. Formato exigido:
            - Un encabezado: '### 🚀 Novedades de la versión ${{ env.TAG }}'
            - Máximo 4 a 6 viñetas claras y comprensibles ordenadas por novedades, mejoras y correcciones.
            - Lenguaje directo sin introducciones ni despedidas de cortesía.

            Commits del push:
            $COMMITS"

            PAYLOAD=$(jq -n --arg prompt "$PROMPT" '{contents: [{parts: [{text: $prompt}]}]}')

            RESPONSE=$(curl -s -X POST \
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent" \
              -H "Content-Type: application/json" \
              -H "X-goog-api-key: $GEMINI_API_KEY" \
              -d "$PAYLOAD")

            NOTES=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty')
          fi

          if [ -z "$NOTES" ] || [ "$NOTES" = "null" ]; then
            echo "Generando notas con fallback directo de Git..."
            NOTES="### 🚀 Novedades de la versión ${{ env.TAG }}

            $COMMITS"
          fi

          echo -e "$NOTES" > release_notes.md
          echo "--- Vista previa de las notas generadas ---"
          cat release_notes.md

      - name: Publish GitHub Release
        if: steps.check_tag.outputs.is_new == 'true' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "NEON OS TV Release ${{ env.TAG }}"
          body_path: release_notes.md
          files: |
            ${{ steps.find_apk.outputs.apk_path }}
            ${{ steps.find_apk.outputs.latest_path }}
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}