name: Build and Auto-Publish Release

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_release:
    name: Build & Auto Release by Gradle Version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Extract Version from Gradle
        id: get_version
        run: |
          VERSION=$(./gradlew -q printVersionName | tail -n 1 | tr -d '\r\n')
          TAG="v$VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Detected App Version: $VERSION"
          echo "Target Release Tag: $TAG"

      - name: Create or Update Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "${{ env.TAG }}"
          git push -f origin "${{ env.TAG }}"

      - name: Prepare Signing Keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Keystore secret encontrado. Decodificando..."
            echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > ${{ runner.temp }}/release.keystore
            echo "KEYSTORE_FILE=${{ runner.temp }}/release.keystore" >> $GITHUB_ENV

            echo "Verificando clave en keystore..."
            keytool -list -keystore ${{ runner.temp }}/release.keystore -storepass "$KEYSTORE_PASSWORD" > /dev/null 2>&1 || {
              echo "::error::La contraseña KEYSTORE_PASSWORD no pudo abrir el keystore. Revisa la contraseña o el Base64."
            }
          else
            echo "Aviso: KEYSTORE_BASE64 no configurado en Secrets. Se usará firma de fallback."
          fi

      - name: Build Release APK
        env:
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Locate Output APK
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release/ -name "SamiBoxTV-*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          fi
          echo "APK encontrado para publicar: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "SamiBox TV Release ${{ env.TAG }}"
          files: ${{ steps.find_apk.outputs.apk_path }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
